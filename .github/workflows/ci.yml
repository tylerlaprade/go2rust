name: CI

on:
  push:
    branches: [master]
  pull_request:
    branches: [master]

jobs:
  lint:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4

      - name: Install current ShellCheck
        run: |
          /home/linuxbrew/.linuxbrew/bin/brew install shellcheck
          echo /home/linuxbrew/.linuxbrew/bin >>"$GITHUB_PATH"

      - name: Fetch shared ShellCheck policy
        run: curl -fsSL -o "$HOME/.shellcheckrc" https://raw.githubusercontent.com/tylerlaprade/dotfiles/master/.shellcheckrc

      - name: Run ShellCheck
        run: git ls-files -z '*.sh' '*.bats' | xargs -0 shellcheck

  test:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4

      - name: Set up Go
        uses: actions/setup-go@v5
        with:
          go-version-file: 'go.mod'

      - name: Check formatting
        run: |
          if [ -n "$(gofmt -l ./go)" ]; then
            echo "Please run 'gofmt -w ./go'"
            gofmt -d ./go
            exit 1
          fi

      - name: Run go vet
        run: |
          # Vet main package only, skip tests directory
          # (Don't lint test files since we want to support any valid Go code)
          go vet ./go

      - name: Build
        run: go build -o go2rust ./go

      - name: Setup BATS
        uses: bats-core/bats-action@3.0.0
        with:
          bats-version: "1.13.0"

      - name: Run tests
        id: fixtures
        run: ./test.sh -v -t 30s

      # The test run rewrites every generated file under tests/ and
      # tests.bats. If that changes anything, the committed snapshots are not
      # what the translator generates. This step runs even when a fixture
      # failed: it used to be skipped then, and the snapshots went stale
      # unnoticed.
      - name: Check that the committed snapshots are current
        if: ${{ !cancelled() && steps.fixtures.conclusion != 'skipped' }}
        run: |
          changed=$(git status --porcelain -- tests tests.bats)
          if [ -n "$changed" ]; then
            echo "ERROR: the test run changed files under tests/ or tests.bats."
            echo ""
            echo "Number of paths: $(echo "$changed" | wc -l)"
            echo "Fixtures:"
            echo "$changed" | awk '{print $2}' | awk -F/ '{ if ($2 == "XFAIL") print $2 "/" $3; else if (NF > 1) print $2; else print $1 }' | sort | uniq -c | sort -rn | head -100
            echo ""
            echo "First 300 lines of the difference:"
            git diff -- tests tests.bats | head -300
            echo ""
            echo "This usually means one of:"
            echo "1. Generated .rs or Cargo.toml files were not regenerated after a translator change."
            echo "2. A fixture in tests/XFAIL/ now passes and was promoted to tests/."
            echo "3. tests.bats was not regenerated after a fixture was added or removed."
            echo ""
            echo "Run ./test.sh locally and commit what it changes."
            exit 1
          fi
