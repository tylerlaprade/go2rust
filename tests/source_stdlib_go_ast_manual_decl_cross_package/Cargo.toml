    "vendor/go2rust_stdlib_stubs",
    "vendor/go_ast",
    "vendor/go_token",
    "vendor/internal_stringslite",
    "vendor/math",
    "vendor/math_bits",
    "vendor/strconv",
    "vendor/unicode",
    "vendor/unicode_utf8",
