
[workspace]
members = [
    ".",
    "vendor/bytes",
    "vendor/go2rust_stdlib_stubs",
    "vendor/internal_bytealg",
    "vendor/io",
    "vendor/math_bits",
    "vendor/oracle_testing",
    "vendor/unicode",
    "vendor/unicode_utf8",
]

[package]
name = "stdlib_package_test_unicode_utf8_constants"
version = "0.1.0"
edition = "2021"

[[bin]]
name = "stdlib_package_test_unicode_utf8_constants"
